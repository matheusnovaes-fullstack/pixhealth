<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pix Health Monitor</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── CONEXÃO ── */
    .conexao-status {
      position: fixed; top: 20px; right: 20px;
      background: #141414; border: 1px solid #222;
      padding: 8px 16px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
      z-index: 1000; color: #555;
    }
    .conexao-status.conectado { border-color: #2d5f3f; color: #4ade80; }
    .conexao-dot { width: 6px; height: 6px; border-radius: 50%; background: #ef4444; }
    .conexao-status.conectado .conexao-dot { background: #4ade80; animation: pulse-dot 2s infinite; }

    /* ── HEADER ── */
    .header {
      max-width: 1100px; margin: 0 auto 24px;
      display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;
    }
    .header h1 { font-size: 24px; font-weight: 700; color: #fff; }
    .header .sub { font-size: 13px; color: #555; margin-top: 4px; }
    .header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ultima-checagem { font-size: 13px; color: #555; }
    .ultima-checagem strong { color: #888; }

    .btn-rel {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px;
      font-size: 13px; font-weight: 600;
      background: #141414; border: 1px solid #222; color: #666;
      text-decoration: none; transition: all 0.2s;
    }
    .btn-rel:hover { border-color: #4ade80; color: #4ade80; }
    .btn-rel svg { width: 14px; height: 14px; }

    /* ── BANNER GERAL ── */
    .banner-geral {
      max-width: 1100px; margin: 0 auto 20px;
      padding: 14px 20px; border-radius: 12px;
      font-size: 14px; font-weight: 600;
      display: flex; align-items: center; gap: 10px;
      border: 1px solid;
    }
    .banner-geral svg { width: 16px; height: 16px; flex-shrink: 0; }
    .banner-geral.up       { background: #0d2b1a; border-color: #1f4730; color: #4ade80; }
    .banner-geral.degraded { background: #1f1600; border-color: #4a3800; color: #fbbf24; }
    .banner-geral.down     { background: #1f0808; border-color: #4a1515; color: #ef4444; }

    /* ── RESUMO CHIPS ── */
    .resumo-bar {
      max-width: 1100px; margin: 0 auto 20px;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .resumo-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 600; border: 1px solid;
    }
    .resumo-chip svg { width: 12px; height: 12px; }
    .chip-up       { background: #0d2b1a; border-color: #1f4730; color: #4ade80; }
    .chip-degraded { background: #1f1600; border-color: #4a3800; color: #fbbf24; }
    .chip-down     { background: #1f0808; border-color: #4a1515; color: #ef4444; }
    .chip-total    { background: #141414; border-color: #222; color: #555; }

    /* ── GRID ── */
    .componentes-grid {
      max-width: 1100px; margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    /* ── CARD ── */
    .comp-card {
      background: #141414; border: 1.5px solid #1e1e1e;
      border-radius: 14px; padding: 20px;
      transition: all 0.25s;
    }
    .comp-card:hover { transform: translateY(-2px); }
    .comp-card.up       { border-color: #1f4730; }
    .comp-card.degraded { border-color: #4a3800; animation: pulse-border-yellow 2.5s infinite; }
    .comp-card.down     { border-color: #4a1515; animation: pulse-border-red 2.5s infinite; }

    @keyframes pulse-border-red {
      0%,100% { border-color: #4a1515; }
      50%     { border-color: #dc3545; box-shadow: 0 0 14px rgba(220,53,69,0.2); }
    }
    @keyframes pulse-border-yellow {
      0%,100% { border-color: #4a3800; }
      50%     { border-color: #d97706; box-shadow: 0 0 14px rgba(217,119,6,0.15); }
    }
    @keyframes pulse-dot {
      0%,100% { opacity: 1; }
      50%     { opacity: 0.3; }
    }

    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .card-nome-wrap { display: flex; align-items: center; gap: 10px; }
    .card-icon { width: 16px; height: 16px; flex-shrink: 0; }
    .comp-card.up .card-icon       { color: #4ade80; }
    .comp-card.degraded .card-icon { color: #fbbf24; animation: pulse-dot 2s infinite; }
    .comp-card.down .card-icon     { color: #ef4444; animation: pulse-dot 2s infinite; }

    .card-nome { font-size: 15px; font-weight: 600; color: #fff; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 6px;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .status-badge svg { width: 10px; height: 10px; }
    .comp-card.up .status-badge       { background: #0d2b1a; color: #4ade80; }
    .comp-card.degraded .status-badge { background: #1f1600; color: #fbbf24; }
    .comp-card.down .status-badge     { background: #1f0808; color: #ef4444; }

    .card-body { display: flex; flex-direction: column; gap: 8px; }
    .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .info-label { color: #555; display: flex; align-items: center; gap: 5px; }
    .info-label svg { width: 12px; height: 12px; }
    .info-val { color: #aaa; font-weight: 500; font-size: 12px; }

    .descricao-box {
      margin-top: 8px; padding: 10px 12px;
      background: #0f0f0f; border-radius: 8px;
      font-size: 12px; color: #888; line-height: 1.6;
    }
    .comp-card.degraded .descricao-box { border-left: 3px solid #fbbf24; }
    .comp-card.down .descricao-box     { border-left: 3px solid #ef4444; }

    .loading { grid-column: 1 / -1; text-align: center; padding: 60px; color: #444; font-size: 14px; }

    @media (max-width: 768px) {
      .componentes-grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <div class="conexao-status" id="conexaoStatus">
    <div class="conexao-dot"></div>
    <span id="conexaoTexto">Conectando...</span>
  </div>

  <div class="header">
    <div>
      <h1>Pix Health Monitor</h1>
      <div class="sub">Monitoramento em tempo real via StatusPage oficial da Okto</div>
    </div>
    <div class="header-controls">
      <div class="ultima-checagem">
        Última verificação <strong id="ultimaAtualizacao">--:--:--</strong>
      </div>
      <a href="/relatorios.html" class="btn-rel">
        <i data-lucide="bar-chart-2"></i> Relatórios
      </a>
    </div>
  </div>

  <div class="banner-geral up" id="bannerGeral">
    <i data-lucide="check-circle" id="bannerIcon"></i>
    <span id="bannerTexto">Carregando status geral...</span>
  </div>

  <div class="resumo-bar" id="resumoBar"></div>

  <div class="componentes-grid" id="componentesGrid">
    <div class="loading">Carregando componentes...</div>
  </div>

  <script>
    lucide.createIcons();

    let ws, tentativas = 0;

    function conectarWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host);

      ws.onopen = () => {
        tentativas = 0;
        document.getElementById('conexaoStatus').className = 'conexao-status conectado';
        document.getElementById('conexaoTexto').textContent = 'Online';
      };
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.tipo === 'atualizacao') renderDashboard(msg.dados);
        } catch {}
      };
      ws.onclose = () => {
        document.getElementById('conexaoStatus').className = 'conexao-status';
        document.getElementById('conexaoTexto').textContent = 'Offline';
        if (tentativas < 8) { tentativas++; setTimeout(conectarWS, 4000); }
      };
    }

    function renderDashboard(dados) {
      document.getElementById('ultimaAtualizacao').textContent =
        new Date(dados.timestamp).toLocaleTimeString('pt-BR');

      const { resumo, componentes, geral } = dados;

      // Banner
      const banner = document.getElementById('bannerGeral');
      const ind = geral?.indicator || 'none';
      let cls = 'up', icone = 'check-circle', msg = 'Todos os sistemas operacionais';

      if (resumo.down > 0 || ind === 'critical' || ind === 'major') {
        cls = 'down'; icone = 'x-circle';
        msg = resumo.down > 0 ? `${resumo.down} sistema(s) fora do ar` : 'Interrupção confirmada';
      } else if (resumo.degraded > 0 || ind === 'minor' || ind === 'maintenance') {
        cls = 'degraded'; icone = 'alert-triangle';
        msg = resumo.degraded > 0 ? `${resumo.degraded} sistema(s) com degradação` : 'Degradação ou manutenção em andamento';
      }
      if (geral?.description) msg += ` — ${geral.description}`;

      banner.className = 'banner-geral ' + cls;
      banner.innerHTML = `<i data-lucide="${icone}"></i><span>${msg}</span>`;

      // Chips
      document.getElementById('resumoBar').innerHTML = `
        <div class="resumo-chip chip-up">
          <i data-lucide="check-circle"></i> OPERACIONAL: ${resumo.up}
        </div>
        ${resumo.degraded > 0 ? `
        <div class="resumo-chip chip-degraded">
          <i data-lucide="alert-triangle"></i> DEGRADAÇÃO: ${resumo.degraded}
        </div>` : ''}
        ${resumo.down > 0 ? `
        <div class="resumo-chip chip-down">
          <i data-lucide="x-circle"></i> DOWN: ${resumo.down}
        </div>` : ''}
        <div class="resumo-chip chip-total">
          <i data-lucide="layers"></i> Total: ${resumo.total}
        </div>
      `;

      // Cards
      const grid = document.getElementById('componentesGrid');
      grid.innerHTML = '';
      const ordem = { DOWN: 0, DEGRADED: 1, UP: 2 };
      [...componentes]
        .sort((a, b) => (ordem[a.status] ?? 99) - (ordem[b.status] ?? 99))
        .forEach(c => {
          const card = document.createElement('div');
          card.className = 'comp-card ' + c.status.toLowerCase();

          const atualizado = c.atualizado_em
            ? new Date(c.atualizado_em).toLocaleString('pt-BR')
            : '—';

          const iconeCard = c.status === 'UP' ? 'check-circle'
                          : c.status === 'DEGRADED' ? 'alert-triangle'
                          : 'x-circle';

          const descHtml = c.status !== 'UP' && c.descricao
            ? `<div class="descricao-box">${c.descricao}</div>`
            : '';

          card.innerHTML = `
            <div class="card-header">
              <div class="card-nome-wrap">
                <i data-lucide="${iconeCard}" class="card-icon"></i>
                <div class="card-nome">${c.nome}</div>
              </div>
              <div class="status-badge">
                <i data-lucide="${iconeCard}"></i>
                ${c.label}
              </div>
            </div>
            <div class="card-body">
              <div class="info-row">
                <span class="info-label"><i data-lucide="activity"></i> Status original</span>
                <span class="info-val">${c.status_original}</span>
              </div>
              <div class="info-row">
                <span class="info-label"><i data-lucide="clock"></i> Atualizado em</span>
                <span class="info-val">${atualizado}</span>
              </div>
              ${descHtml}
            </div>
          `;
          grid.appendChild(card);
        });

      lucide.createIcons();
    }

    setTimeout(() => {
      conectarWS();
      fetch('/api/status')
        .then(r => r.json())
        .then(d => { if (d?.componentes) renderDashboard(d); })
        .catch(() => {});
    }, 400);
  </script>
</body>
</html>
