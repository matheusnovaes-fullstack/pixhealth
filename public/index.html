<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okto Payments – Status Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── CONEXÃO ── */
    .conexao-status {
      position: fixed; top: 20px; right: 20px;
      background: #1a1a1a; border: 1px solid #2a2a2a;
      padding: 8px 16px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
      z-index: 1000; color: #888;
    }
    .conexao-status.conectado { border-color: #2d5f3f; color: #4ade80; }
    .conexao-dot { width: 6px; height: 6px; border-radius: 50%; background: #ef4444; }
    .conexao-status.conectado .conexao-dot { background: #4ade80; animation: pulse-dot 2s infinite; }

    /* ── HEADER ── */
    .header {
      max-width: 1100px; margin: 0 auto 28px;
      display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;
    }
    .header h1 { font-size: 26px; font-weight: 700; color: #fff; }
    .header .sub { font-size: 13px; color: #888; margin-top: 4px; }
    .header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ultima-checagem { font-size: 13px; color: #888; }
    .ultima-checagem strong { color: #fff; }

    .btn { padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; transition: all 0.2s; }
    .btn-relatorios { background: #1a1a1a; border: 1px solid #2a2a2a; color: #888; }
    .btn-relatorios:hover { border-color: #4ade80; color: #4ade80; }

    /* ── BANNER GERAL ── */
    .banner-geral {
      max-width: 1100px; margin: 0 auto 24px;
      padding: 16px 22px; border-radius: 12px;
      font-size: 15px; font-weight: 600;
      display: flex; align-items: center; gap: 12px;
      border: 1px solid;
    }
    .banner-geral.up       { background: #0d2b1a; border-color: #2d5f3f; color: #4ade80; }
    .banner-geral.degraded { background: #2b2000; border-color: #5f4a00; color: #fbbf24; }
    .banner-geral.down     { background: #2b0a0a; border-color: #5f1a1a; color: #ef4444; }
    .banner-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .banner-geral.up .banner-dot       { background: #4ade80; }
    .banner-geral.degraded .banner-dot { background: #fbbf24; animation: pulse-dot 2s infinite; }
    .banner-geral.down .banner-dot     { background: #ef4444; animation: pulse-dot 2s infinite; }

    /* ── RESUMO ── */
    .resumo-bar {
      max-width: 1100px; margin: 0 auto 24px;
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .resumo-chip {
      padding: 6px 16px; border-radius: 20px;
      font-size: 13px; font-weight: 600; border: 1px solid;
    }
    .chip-up       { background: #0d2b1a; border-color: #2d5f3f; color: #4ade80; }
    .chip-degraded { background: #2b2000; border-color: #5f4a00; color: #fbbf24; }
    .chip-down     { background: #2b0a0a; border-color: #5f1a1a; color: #ef4444; }

    /* ── GRID ── */
    .componentes-grid {
      max-width: 1100px; margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    /* ── CARD ── */
    .comp-card {
      background: #141414;
      border: 1.5px solid #222;
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s;
    }
    .comp-card:hover { transform: translateY(-2px); border-color: #333; }

    .comp-card.up       { border-color: #1f4730; }
    .comp-card.degraded { border-color: #4a3800; animation: pulse-border-yellow 2s infinite; }
    .comp-card.down     { border-color: #4a1515; animation: pulse-border-red 2s infinite; }

    @keyframes pulse-border-red {
      0%,100% { border-color: #4a1515; }
      50%     { border-color: #dc3545; box-shadow: 0 0 16px rgba(220,53,69,0.25); }
    }
    @keyframes pulse-border-yellow {
      0%,100% { border-color: #4a3800; }
      50%     { border-color: #d97706; box-shadow: 0 0 16px rgba(217,119,6,0.2); }
    }
    @keyframes pulse-dot {
      0%,100% { opacity: 1; }
      50%     { opacity: 0.3; }
    }

    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .card-nome-wrap { display: flex; align-items: center; gap: 10px; }
    .card-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .comp-card.up .card-dot       { background: #4ade80; }
    .comp-card.degraded .card-dot { background: #fbbf24; animation: pulse-dot 2s infinite; }
    .comp-card.down .card-dot     { background: #ef4444; animation: pulse-dot 2s infinite; }

    .card-nome { font-size: 16px; font-weight: 600; color: #fff; }

    .status-badge {
      padding: 3px 12px; border-radius: 6px;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .comp-card.up .status-badge       { background: #0d2b1a; color: #4ade80; }
    .comp-card.degraded .status-badge { background: #2b2000; color: #fbbf24; }
    .comp-card.down .status-badge     { background: #2b0a0a; color: #ef4444; }

    .card-body { display: flex; flex-direction: column; gap: 8px; }
    .info-row { display: flex; justify-content: space-between; font-size: 13px; }
    .info-label { color: #666; }
    .info-val   { color: #ccc; font-weight: 500; }

    .descricao-box {
      margin-top: 10px; padding: 10px 12px;
      background: #0f0f0f; border-radius: 8px;
      font-size: 12px; color: #aaa; line-height: 1.6;
      border-left: 3px solid #fbbf24;
    }
    .comp-card.down .descricao-box { border-left-color: #ef4444; }

    /* ── LOADING ── */
    .loading { grid-column: 1 / -1; text-align: center; padding: 60px; color: #666; font-size: 15px; }

    @media (max-width: 768px) {
      .componentes-grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <div class="conexao-status" id="conexaoStatus">
    <div class="conexao-dot"></div>
    <span id="conexaoTexto">Conectando...</span>
  </div>

  <div class="header">
    <div>
      <h1>Okto Payments – Status Monitor</h1>
      <div class="sub">Monitoramento em tempo real via StatusPage oficial</div>
    </div>
    <div class="header-controls">
      <div class="ultima-checagem">
        Última verificação <strong id="ultimaAtualizacao">--:--:--</strong>
      </div>
      <a href="/relatorios.html" class="btn btn-relatorios">Relatórios</a>
    </div>
  </div>

  <!-- Banner geral -->
  <div class="banner-geral up" id="bannerGeral">
    <div class="banner-dot"></div>
    <span id="bannerTexto">Carregando status geral...</span>
  </div>

  <!-- Chips de resumo -->
  <div class="resumo-bar" id="resumoBar"></div>

  <!-- Grid de componentes -->
  <div class="componentes-grid" id="componentesGrid">
    <div class="loading">Carregando componentes...</div>
  </div>

  <script>
    let ws;
    let tentativas = 0;

    function conectarWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host);

      ws.onopen = () => {
        tentativas = 0;
        document.getElementById('conexaoStatus').className = 'conexao-status conectado';
        document.getElementById('conexaoTexto').textContent = 'Online';
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.tipo === 'atualizacao') renderDashboard(msg.dados);
        } catch {}
      };

      ws.onclose = () => {
        document.getElementById('conexaoStatus').className = 'conexao-status';
        document.getElementById('conexaoTexto').textContent = 'Offline';
        if (tentativas < 6) { tentativas++; setTimeout(conectarWS, 4000); }
      };
    }

    function renderDashboard(dados) {
      // Hora
      document.getElementById('ultimaAtualizacao').textContent =
        new Date(dados.timestamp).toLocaleTimeString('pt-BR');

      const { resumo, componentes, geral } = dados;

      // Banner geral
      const banner = document.getElementById('bannerGeral');
      const ind = geral?.indicator || 'none';
      let bannerClasse = 'up', bannerMsg = '✅ Todos os sistemas operacionais';
      if (ind === 'critical' || ind === 'major') {
        bannerClasse = 'down';
        bannerMsg = '🔴 Interrupção confirmada em um ou mais sistemas';
      } else if (ind === 'minor' || ind === 'maintenance') {
        bannerClasse = 'degraded';
        bannerMsg = '🟡 Degradação ou manutenção em andamento';
      } else if (resumo.down > 0) {
        bannerClasse = 'down';
        bannerMsg = `🔴 ${resumo.down} sistema(s) fora do ar`;
      } else if (resumo.degraded > 0) {
        bannerClasse = 'degraded';
        bannerMsg = `🟡 ${resumo.degraded} sistema(s) degradado(s)`;
      }
      banner.className = 'banner-geral ' + bannerClasse;
      document.getElementById('bannerTexto').textContent = bannerMsg + (geral?.description ? ` — ${geral.description}` : '');

      // Chips
      document.getElementById('resumoBar').innerHTML = `
        <div class="resumo-chip chip-up">✅ UP: ${resumo.up}</div>
        ${resumo.degraded > 0 ? `<div class="resumo-chip chip-degraded">🟡 DEGRADED: ${resumo.degraded}</div>` : ''}
        ${resumo.down > 0     ? `<div class="resumo-chip chip-down">🔴 DOWN: ${resumo.down}</div>` : ''}
        <div class="resumo-chip" style="background:#1a1a1a;border-color:#2a2a2a;color:#666">Total: ${resumo.total}</div>
      `;

      // Cards
      const grid = document.getElementById('componentesGrid');
      grid.innerHTML = '';

      // Ordena: DOWN primeiro, depois DEGRADED, depois UP
      const ordem = { DOWN: 0, DEGRADED: 1, UP: 2 };
      const ordenados = [...componentes].sort((a, b) => (ordem[a.status] || 99) - (ordem[b.status] || 99));

      ordenados.forEach(c => {
        const card = document.createElement('div');
        card.className = 'comp-card ' + c.status.toLowerCase();

        const atualizado = c.atualizado_em
          ? new Date(c.atualizado_em).toLocaleString('pt-BR')
          : '—';

        const descHtml = (c.status !== 'UP' && c.descricao)
          ? `<div class="descricao-box">${c.descricao}</div>`
          : '';

        card.innerHTML = `
          <div class="card-header">
            <div class="card-nome-wrap">
              <div class="card-dot"></div>
              <div class="card-nome">${c.nome}</div>
            </div>
            <div class="status-badge">${c.label}</div>
          </div>
          <div class="card-body">
            <div class="info-row">
              <span class="info-label">Status original</span>
              <span class="info-val">${c.status_original}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Atualizado em</span>
              <span class="info-val">${atualizado}</span>
            </div>
            ${descHtml}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Inicializa
    setTimeout(() => {
      conectarWS();
      fetch('/api/status')
        .then(r => r.json())
        .then(dados => { if (dados?.componentes) renderDashboard(dados); })
        .catch(() => {});
    }, 400);
  </script>
</body>
</html>
