<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pix Health Monitor</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg:        #080808;
      --surface:   #111111;
      --border:    #1c1c1c;
      --border-md: #242424;
      --text:      #e8e8e8;
      --muted:     #555;
      --faint:     #333;
      --green:     #22c55e;
      --green-dim: #0d2b1a;
      --green-bd:  #1a4d30;
      --yellow:    #eab308;
      --yellow-dim:#1e1600;
      --yellow-bd: #3d2e00;
      --red:       #ef4444;
      --red-dim:   #1a0808;
      --red-bd:    #3d1212;
      --blue:      #60a5fa;
      --blue-dim:  #0a1628;
      --blue-bd:   #1e3356;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── TOPBAR ─── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(8,8,8,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .topbar-logo {
      display: flex; align-items: center; gap: 9px;
      font-size: 15px; font-weight: 700; color: var(--text);
    }
    .topbar-logo svg { width: 18px; height: 18px; color: var(--green); }
    .topbar-sep { width: 1px; height: 18px; background: var(--border-md); }
    .topbar-sub { font-size: 12px; color: var(--muted); }

    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .topbar-time { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .topbar-time svg { width: 12px; height: 12px; }

    .ws-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px;
      border: 1px solid var(--border-md);
      font-size: 11px; font-weight: 600; color: var(--muted);
      transition: all 0.3s;
    }
    .ws-pill.ok { border-color: var(--green-bd); color: var(--green); }
    .ws-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--red); }
    .ws-pill.ok .ws-dot { background: var(--green); animation: blink 2s infinite; }

    .btn-rel {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 7px;
      font-size: 12px; font-weight: 600;
      background: var(--surface); border: 1px solid var(--border-md);
      color: var(--muted); text-decoration: none; transition: all 0.2s;
    }
    .btn-rel svg { width: 13px; height: 13px; }
    .btn-rel:hover { border-color: var(--green-bd); color: var(--green); }

    /* ─── LAYOUT ─── */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

    /* ─── BANNER GERAL ─── */
    .banner {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px; border-radius: 12px;
      margin-bottom: 8px; border: 1px solid;
      font-size: 14px; font-weight: 600;
      transition: all 0.4s;
    }
    .banner svg { width: 16px; height: 16px; flex-shrink: 0; }
    .banner.up       { background: var(--green-dim); border-color: var(--green-bd); color: var(--green); }
    .banner.degraded { background: var(--yellow-dim); border-color: var(--yellow-bd); color: var(--yellow); }
    .banner.down     { background: var(--red-dim);    border-color: var(--red-bd);   color: var(--red);
                       animation: pulse-banner 2s infinite; }
    @keyframes pulse-banner {
      0%,100% { box-shadow: none; }
      50%     { box-shadow: 0 0 20px rgba(239,68,68,0.15); }
    }

    /* ─── INCIDENTES ATIVOS ─── */
    .incidentes-wrap { margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
    .incidente-card {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 16px; border-radius: 10px;
      background: var(--red-dim); border: 1px solid var(--red-bd);
      font-size: 13px;
    }
    .incidente-card svg { width: 15px; height: 15px; color: var(--red); flex-shrink: 0; margin-top: 1px; }
    .incidente-nome { font-weight: 600; color: var(--red); margin-bottom: 2px; }
    .incidente-meta { font-size: 11px; color: var(--muted); }

    /* ─── CHIPS RESUMO ─── */
    .resumo-chips {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; margin-top: 12px;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 13px; border-radius: 20px;
      font-size: 11px; font-weight: 700; border: 1px solid;
      letter-spacing: 0.3px;
    }
    .chip svg { width: 11px; height: 11px; }
    .chip-up       { background: var(--green-dim); border-color: var(--green-bd); color: var(--green); }
    .chip-degraded { background: var(--yellow-dim); border-color: var(--yellow-bd); color: var(--yellow); }
    .chip-down     { background: var(--red-dim); border-color: var(--red-bd); color: var(--red); }
    .chip-total    { background: var(--surface); border-color: var(--border-md); color: var(--muted); }

    /* ─── SEÇÃO ─── */
    .section { margin-bottom: 32px; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .section-header svg { width: 15px; height: 15px; color: var(--muted); }
    .section-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; }
    .section-count {
      margin-left: auto;
      font-size: 11px; color: var(--faint); font-weight: 600;
    }

    /* ─── GRID ─── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
    }

    /* ─── CARD ─── */
    .comp-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px;
      transition: border-color 0.3s, transform 0.2s, box-shadow 0.3s;
      cursor: default;
    }
    .comp-card:hover { transform: translateY(-1px); border-color: var(--border-md); }

    .comp-card.up       { border-color: var(--green-bd); }
    .comp-card.degraded {
      border-color: var(--yellow-bd);
      animation: pulse-yellow 2.5s infinite;
    }
    .comp-card.down {
      border-color: var(--red-bd);
      animation: pulse-red 2s infinite;
    }

    @keyframes pulse-red {
      0%,100% { border-color: var(--red-bd); box-shadow: none; }
      50%     { border-color: var(--red); box-shadow: 0 0 12px rgba(239,68,68,0.18); }
    }
    @keyframes pulse-yellow {
      0%,100% { border-color: var(--yellow-bd); box-shadow: none; }
      50%     { border-color: var(--yellow); box-shadow: 0 0 12px rgba(234,179,8,0.12); }
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50%     { opacity: 0.3; }
    }

    .card-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .card-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .card-icon { width: 14px; height: 14px; flex-shrink: 0; }
    .comp-card.up       .card-icon { color: var(--green); }
    .comp-card.degraded .card-icon { color: var(--yellow); animation: blink 2s infinite; }
    .comp-card.down     .card-icon { color: var(--red);    animation: blink 1.5s infinite; }

    .card-nome {
      font-size: 14px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .status-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 5px; flex-shrink: 0;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .status-badge svg { width: 9px; height: 9px; }
    .comp-card.up       .status-badge { background: var(--green-dim); color: var(--green); }
    .comp-card.degraded .status-badge { background: var(--yellow-dim); color: var(--yellow); }
    .comp-card.down     .status-badge { background: var(--red-dim);    color: var(--red); }

    .card-meta {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--muted);
    }
    .card-meta-item { display: flex; align-items: center; gap: 4px; }
    .card-meta-item svg { width: 10px; height: 10px; }

    .card-desc {
      margin-top: 10px; padding: 9px 12px;
      background: var(--bg); border-radius: 7px;
      font-size: 11px; color: #888; line-height: 1.6;
      border-left: 2px solid;
    }
    .comp-card.degraded .card-desc { border-left-color: var(--yellow); }
    .comp-card.down     .card-desc { border-left-color: var(--red); }

    /* ─── LOADING ─── */
    .loading-grid { grid-column: 1 / -1; text-align: center; padding: 50px; color: var(--faint); font-size: 13px; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .topbar { padding: 0 16px; }
      .topbar-sub, .topbar-sep { display: none; }
      .wrap { padding: 20px 16px 50px; }
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">
        <i data-lucide="activity"></i>
        Pix Health Monitor
      </div>
      <div class="topbar-sep"></div>
      <div class="topbar-sub">Okto Payments · StatusPage oficial</div>
    </div>
    <div class="topbar-right">
      <div class="topbar-time">
        <i data-lucide="clock"></i>
        <span>Última verificação: <strong id="ultimaAtt">--:--:--</strong></span>
      </div>
      <div class="ws-pill" id="wsPill">
        <div class="ws-dot"></div>
        <span id="wsTexto">Conectando</span>
      </div>
      <a href="/relatorios.html" class="btn-rel">
        <i data-lucide="bar-chart-2"></i> Relatórios
      </a>
    </div>
  </header>

  <div class="wrap">

    <!-- BANNER GERAL -->
    <div class="banner up" id="banner">
      <i data-lucide="check-circle"></i>
      <span id="bannerTexto">Carregando status...</span>
    </div>

    <!-- INCIDENTES ATIVOS -->
    <div class="incidentes-wrap" id="incidentesWrap"></div>

    <!-- CHIPS -->
    <div class="resumo-chips" id="chips"></div>

    <!-- SEÇÃO: APIS -->
    <div class="section" id="secao-apis">
      <div class="section-header">
        <i data-lucide="zap"></i>
        <span class="section-title">APIs & Infraestrutura</span>
        <span class="section-count" id="count-apis"></span>
      </div>
      <div class="cards-grid" id="grid-apis">
        <div class="loading-grid">Carregando...</div>
      </div>
    </div>

    <!-- SEÇÃO: BANCOS -->
    <div class="section" id="secao-bancos">
      <div class="section-header">
        <i data-lucide="landmark"></i>
        <span class="section-title">Brazilian Banks</span>
        <span class="section-count" id="count-bancos"></span>
      </div>
      <div class="cards-grid" id="grid-bancos">
        <div class="loading-grid">Carregando...</div>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();

    let ws, tentativas = 0;

    function conectarWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host);
      ws.onopen = () => {
        tentativas = 0;
        document.getElementById('wsPill').className = 'ws-pill ok';
        document.getElementById('wsTexto').textContent = 'Ao vivo';
      };
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.tipo === 'atualizacao') render(msg.dados);
        } catch {}
      };
      ws.onclose = () => {
        document.getElementById('wsPill').className = 'ws-pill';
        document.getElementById('wsTexto').textContent = 'Reconectando';
        if (tentativas < 10) { tentativas++; setTimeout(conectarWS, 4000); }
      };
    }

    function iconeStatus(status) {
      return status === 'UP' ? 'check-circle' : status === 'DEGRADED' ? 'alert-triangle' : 'x-circle';
    }

    function criarCard(c) {
      const ic = iconeStatus(c.status);
      const att = c.atualizado_em ? new Date(c.atualizado_em).toLocaleString('pt-BR') : '—';
      const descHtml = c.status !== 'UP' && c.descricao
        ? `<div class="card-desc">${c.descricao}</div>` : '';

      return `
        <div class="comp-card ${c.status.toLowerCase()}">
          <div class="card-top">
            <div class="card-left">
              <i data-lucide="${ic}" class="card-icon"></i>
              <span class="card-nome">${c.nome}</span>
            </div>
            <div class="status-badge">
              <i data-lucide="${ic}"></i>
              ${c.label}
            </div>
          </div>
          <div class="card-meta">
            <div class="card-meta-item">
              <i data-lucide="activity"></i>
              ${c.status_original}
            </div>
            <div class="card-meta-item">
              <i data-lucide="clock"></i>
              ${att}
            </div>
          </div>
          ${descHtml}
        </div>
      `;
    }

    function render(dados) {
      document.getElementById('ultimaAtt').textContent =
        new Date(dados.timestamp).toLocaleTimeString('pt-BR');

      const { resumo, componentes, geral, incidentes = [] } = dados;

      // Banner
      const banner = document.getElementById('banner');
      const ind = geral?.indicator || 'none';
      let cls = 'up', ic = 'check-circle', msg = 'Todos os sistemas operacionais';
      if (resumo.down > 0 || ind === 'critical' || ind === 'major') {
        cls = 'down'; ic = 'x-circle';
        msg = resumo.down > 0 ? `${resumo.down} sistema(s) fora do ar` : 'Interrupção confirmada pela StatusPage';
      } else if (resumo.degraded > 0 || ind === 'minor' || ind === 'maintenance') {
        cls = 'degraded'; ic = 'alert-triangle';
        msg = resumo.degraded > 0 ? `${resumo.degraded} sistema(s) com degradação detectada` : 'Degradação ou manutenção em andamento';
      }
      if (geral?.description && geral.description !== 'All Systems Operational') msg += ` — ${geral.description}`;
      banner.className = 'banner ' + cls;
      banner.innerHTML = `<i data-lucide="${ic}"></i><span>${msg}</span>`;

      // Incidentes ativos
      const incWrap = document.getElementById('incidentesWrap');
      incWrap.innerHTML = incidentes.map(i => `
        <div class="incidente-card">
          <i data-lucide="alert-octagon"></i>
          <div>
            <div class="incidente-nome">${i.nome}</div>
            <div class="incidente-meta">Status: ${i.status} · Impacto: ${i.impacto} · Atualizado: ${new Date(i.atualizado).toLocaleString('pt-BR')}</div>
          </div>
        </div>
      `).join('');

      // Chips
      document.getElementById('chips').innerHTML = `
        <div class="chip chip-up"><i data-lucide="check-circle"></i> OPERACIONAL: ${resumo.up}</div>
        ${resumo.degraded > 0 ? `<div class="chip chip-degraded"><i data-lucide="alert-triangle"></i> DEGRADAÇÃO: ${resumo.degraded}</div>` : ''}
        ${resumo.down > 0     ? `<div class="chip chip-down"><i data-lucide="x-circle"></i> DOWN: ${resumo.down}</div>` : ''}
        <div class="chip chip-total"><i data-lucide="layers"></i> Total: ${resumo.total}</div>
      `;

      // Separa por grupo
      const apis   = componentes.filter(c => !c.grupo);
      const bancos = componentes.filter(c =>  c.grupo);

      document.getElementById('count-apis').textContent   = `${apis.length} componente${apis.length !== 1 ? 's' : ''}`;
      document.getElementById('count-bancos').textContent = `${bancos.length} banco${bancos.length !== 1 ? 's' : ''}`;

      document.getElementById('grid-apis').innerHTML   = apis.length   ? apis.map(criarCard).join('')   : '<div class="loading-grid">Nenhum dado</div>';
      document.getElementById('grid-bancos').innerHTML = bancos.length ? bancos.map(criarCard).join('') : '<div class="loading-grid">Nenhum dado</div>';

      lucide.createIcons();
    }

    setTimeout(() => {
      conectarWS();
      fetch('/api/status').then(r => r.json()).then(d => { if (d?.componentes) render(d); }).catch(() => {});
    }, 300);
  </script>
</body>
</html>
