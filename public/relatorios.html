<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pix Health Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg:          #060608;
      --bg2:         #0a0a0d;
      --surface:     #0f0f13;
      --surface2:    #141418;
      --border:      #1a1a20;
      --border-md:   #222228;
      --border-hi:   #2e2e38;
      --text:        #f0f0f5;
      --text-2:      #a0a0b0;
      --muted:       #4a4a5a;
      --faint:       #252530;
      --green:       #1fd97a;
      --green-dim:   #071a10;
      --green-bd:    #0f3320;
      --green-glow:  rgba(31,217,122,0.12);
      --yellow:      #f5c842;
      --yellow-dim:  #1a1400;
      --yellow-bd:   #352800;
      --yellow-glow: rgba(245,200,66,0.1);
      --red:         #ff4d4d;
      --red-dim:     #1a0606;
      --red-bd:      #3a0e0e;
      --red-glow:    rgba(255,77,77,0.12);
      --blue:        #5b9ef7;
      --purple:      #a78bfa;
      --purple-dim:  #120d2a;
      --purple-bd:   #2d1f5e;
      --mono:        'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }

    /* ─── TOPBAR ─── */
    .topbar {
      position: sticky; top: 0; z-index: 200;
      background: rgba(6,6,8,0.95); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 36px; height: 58px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--green-dim); border: 1px solid var(--green-bd);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { width: 15px; height: 15px; color: var(--green); }
    .logo-name  { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
    .logo-tag   {
      font-size: 10px; font-weight: 600; color: var(--muted);
      background: var(--surface2); border: 1px solid var(--border-md);
      padding: 2px 8px; border-radius: 4px; letter-spacing: 0.4px;
    }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .topbar-clock {
      font-family: var(--mono); font-size: 12px; font-weight: 500;
      color: var(--text-2); background: var(--surface);
      border: 1px solid var(--border-md); padding: 5px 12px; border-radius: 6px;
    }
    .ws-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 6px;
      border: 1px solid var(--border-md); font-size: 11px; font-weight: 600;
      color: var(--muted); background: var(--surface); transition: all 0.3s;
    }
    .ws-pill.ok { border-color: var(--green-bd); color: var(--green); background: var(--green-dim); }
    .ws-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
    .ws-pill.ok .ws-dot { background: var(--green); animation: blink 2s infinite; }
    .btn-nav {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border-md);
      color: var(--text-2); text-decoration: none; transition: all 0.2s;
    }
    .btn-nav svg { width: 13px; height: 13px; }
    .btn-nav:hover { border-color: var(--green-bd); color: var(--green); background: var(--green-dim); }

    /* ─── WRAP ─── */
    .wrap { max-width: 1280px; margin: 0 auto; padding: 32px 28px 80px; }

    /* ─── HERO ─── */
    .hero { display: flex; gap: 12px; margin-bottom: 10px; }
    .hero-banner {
      flex: 1; display: flex; align-items: center; gap: 14px;
      padding: 18px 24px; border-radius: 12px; border: 1px solid;
      font-size: 15px; font-weight: 600; letter-spacing: -0.2px; transition: all 0.4s;
    }
    .hero-banner svg { width: 18px; height: 18px; flex-shrink: 0; }
    .hero-banner.up       { background: var(--green-dim); border-color: var(--green-bd); color: var(--green); }
    .hero-banner.degraded { background: var(--yellow-dim); border-color: var(--yellow-bd); color: var(--yellow); }
    .hero-banner.down     { background: var(--red-dim); border-color: var(--red-bd); color: var(--red); animation: pulse-banner 2s infinite; }
    @keyframes pulse-banner { 0%,100% { box-shadow: none; } 50% { box-shadow: 0 0 28px var(--red-glow); } }
    .hero-meta {
      display: flex; flex-direction: column; align-items: flex-end;
      justify-content: center; gap: 3px; padding: 16px 20px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      min-width: 170px;
    }
    .hero-meta-label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
    .hero-meta-val   { font-family: var(--mono); font-size: 13px; color: var(--text-2); }

    /* ─── CHIPS ─── */
    .resumo-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; margin-top: 10px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 14px; border-radius: 6px;
      font-size: 11px; font-weight: 700; border: 1px solid;
      letter-spacing: 0.4px; font-family: var(--mono);
    }
    .chip svg { width: 10px; height: 10px; }
    .chip-up       { background: var(--green-dim);  border-color: var(--green-bd);  color: var(--green); }
    .chip-degraded { background: var(--yellow-dim); border-color: var(--yellow-bd); color: var(--yellow); }
    .chip-down     { background: var(--red-dim);    border-color: var(--red-bd);    color: var(--red); }
    .chip-incident { background: var(--yellow-dim); border-color: var(--yellow-bd); color: var(--yellow); }
    .chip-total    { background: var(--surface);    border-color: var(--border-md); color: var(--muted); }

    /* Aviso de incidente ativo inline no card (componente ainda operational) */
    .inc-aviso {
      margin-top: 10px; padding: 10px 12px; border-radius: 7px;
      background: var(--yellow-dim); border: 1px solid var(--yellow-bd);
      display: flex; flex-direction: column; gap: 4px;
    }
    .inc-aviso-titulo {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700; color: var(--yellow);
    }
    .inc-aviso-titulo svg { width: 11px; height: 11px; flex-shrink: 0; }
    .inc-aviso-body { font-size: 11px; color: var(--text-2); line-height: 1.5; }

    /* ─── SEÇÃO ─── */
    .section { margin-bottom: 36px; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .section-icon {
      width: 28px; height: 28px; border-radius: 7px;
      background: var(--surface2); border: 1px solid var(--border-md);
      display: flex; align-items: center; justify-content: center;
    }
    .section-icon svg { width: 13px; height: 13px; color: var(--text-2); }
    .section-title { font-size: 11px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 1px; }
    .section-count { margin-left: auto; font-size: 11px; color: var(--muted); font-family: var(--mono); }

    /* ─── GRID ─── */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 10px; }

    /* ─── CARD BASE ─── */
    .comp-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      transition: border-color 0.3s, transform 0.2s, box-shadow 0.3s;
    }
    .comp-card:hover { transform: translateY(-2px); }
    .card-accent { height: 3px; }
    .comp-card.up       .card-accent { background: var(--green-bd); }
    .comp-card.degraded .card-accent { background: var(--yellow); animation: bar-blink 2s infinite; }
    .comp-card.down     .card-accent { background: var(--red);    animation: bar-blink 1.5s infinite; }
    @keyframes bar-blink { 0%,100% { opacity:1; } 50% { opacity:0.35; } }
    .comp-card.up       { border-color: var(--green-bd); }
    .comp-card.degraded { border-color: var(--yellow-bd); animation: pulse-yellow 3s infinite; }
    .comp-card.down     { border-color: var(--red-bd);    animation: pulse-red    2s infinite; }
    /* warning = componente operational mas com incidente ativo reportado */
    .comp-card.warning  { border-color: var(--yellow-bd); animation: pulse-yellow 3s infinite; }
    .comp-card.warning  .card-accent  { background: var(--yellow); animation: bar-blink 2s infinite; }
    .comp-card.warning  .card-dot     { background: var(--yellow); animation: blink 2s infinite; }
    .comp-card.warning  .status-badge { background: var(--yellow-dim); color: var(--yellow); border-color: var(--yellow-bd); }
    .comp-card.warning  .btn-incidente{ color: var(--yellow); border-color: var(--yellow-bd); }
    .comp-card.warning  .btn-incidente:hover { background: var(--yellow-dim); }
    @keyframes pulse-red    { 0%,100% { border-color:var(--red-bd);    box-shadow:none; } 50% { border-color:var(--red);    box-shadow:0 0 16px var(--red-glow); } }
    @keyframes pulse-yellow { 0%,100% { border-color:var(--yellow-bd); box-shadow:none; } 50% { border-color:var(--yellow); box-shadow:0 0 16px var(--yellow-glow); } }
    @keyframes blink        { 0%,100% { opacity:1; } 50% { opacity:0.2; } }

    .card-body { padding: 16px 18px 18px; }
    .card-top  { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .card-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .card-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .comp-card.up       .card-dot { background: var(--green);  box-shadow: 0 0 6px var(--green-glow); }
    .comp-card.degraded .card-dot { background: var(--yellow); animation: blink 2s infinite; }
    .comp-card.down     .card-dot { background: var(--red);    animation: blink 1.5s infinite; }
    .card-nome {
      font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -0.2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 5px; flex-shrink: 0;
      font-size: 10px; font-weight: 700; font-family: var(--mono);
      text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid;
    }
    .status-badge svg { width: 9px; height: 9px; }
    .comp-card.up       .status-badge { background: var(--green-dim);  color: var(--green);  border-color: var(--green-bd); }
    .comp-card.degraded .status-badge { background: var(--yellow-dim); color: var(--yellow); border-color: var(--yellow-bd); }
    .comp-card.down     .status-badge { background: var(--red-dim);    color: var(--red);    border-color: var(--red-bd); }
    .card-divider { height: 1px; background: var(--border); margin-bottom: 12px; }
    .card-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .card-meta-item { display: flex; align-items: center; gap: 4px; font-family: var(--mono); }
    .card-meta-item svg { width: 10px; height: 10px; }

    /* ─── KYC: área extra do card ─── */
    .kyc-ok {
      margin-top: 10px; padding: 8px 12px; border-radius: 7px;
      font-size: 11px; font-weight: 500; display: flex; align-items: center; gap: 6px;
      background: var(--green-dim); border: 1px solid var(--green-bd); color: var(--green);
    }
    .kyc-ok svg { width: 11px; height: 11px; flex-shrink: 0; }
    .kyc-warn {
      margin-top: 10px; padding: 8px 12px; border-radius: 7px;
      font-size: 11px; font-weight: 500; display: flex; align-items: center; gap: 6px;
      background: var(--yellow-dim); border: 1px solid var(--yellow-bd); color: var(--yellow);
    }
    .kyc-warn svg { width: 11px; height: 11px; flex-shrink: 0; }

    .kyc-detalhes { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .kyc-det-label {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.6px;
      display: flex; align-items: center; gap: 5px; margin-bottom: 2px;
    }
    .kyc-det-label svg { width: 10px; height: 10px; }
    .kyc-det-item {
      background: var(--bg2); border-radius: 7px; padding: 9px 12px;
      border-left: 2px solid var(--border-md);
      display: flex; flex-direction: column; gap: 3px;
    }
    .kyc-det-item.det-down     { border-left-color: var(--red); }
    .kyc-det-item.det-degraded { border-left-color: var(--yellow); }
    .kyc-det-row   { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .kyc-det-nome  { font-size: 12px; font-weight: 600; color: var(--text); }
    .kyc-det-badge {
      font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 3px;
      font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.3px;
    }
    .kyc-det-badge.down     { background: var(--red-dim);    color: var(--red);    border: 1px solid var(--red-bd); }
    .kyc-det-badge.degraded { background: var(--yellow-dim); color: var(--yellow); border: 1px solid var(--yellow-bd); }
    .kyc-det-motivo { font-size: 11px; color: var(--muted); line-height: 1.5; }

    /* ─── BOTÃO INCIDENTE (Okto) ─── */
    .btn-incidente {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      margin-top: 13px; padding: 8px 14px; border-radius: 7px;
      font-size: 11px; font-weight: 700; cursor: pointer; font-family: var(--mono);
      border: 1px solid; transition: all 0.2s; width: 100%;
      background: transparent; letter-spacing: 0.4px; text-transform: uppercase;
    }
    .btn-incidente svg { width: 12px; height: 12px; }
    .comp-card.degraded .btn-incidente { color: var(--yellow); border-color: var(--yellow-bd); }
    .comp-card.degraded .btn-incidente:hover { background: var(--yellow-dim); }
    .comp-card.down     .btn-incidente { color: var(--red);    border-color: var(--red-bd); }
    .comp-card.down     .btn-incidente:hover { background: var(--red-dim); }

    /* ─── MODAL ─── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.82); backdrop-filter: blur(6px);
      z-index: 500; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; animation: fadeIn 0.15s; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .modal {
      background: var(--surface2); border: 1px solid var(--border-hi);
      border-radius: 14px; width: 100%; max-width: 580px;
      max-height: 82vh; overflow-y: auto; margin: 20px;
      animation: slideUp 0.22s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes slideUp { from { transform:translateY(18px) scale(0.98); opacity:0; } to { transform:translateY(0) scale(1); opacity:1; } }
    .modal-top-bar { height: 3px; background: var(--red); border-radius: 14px 14px 0 0; }
    .modal-top-bar.degraded { background: var(--yellow); }
    .modal-inner   { padding: 24px 28px 28px; }
    .modal-header  { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .modal-titulo  { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .modal-sub     { font-size: 11px; color: var(--muted); margin-top: 4px; font-family: var(--mono); }
    .modal-fechar  {
      background: var(--surface); border: 1px solid var(--border-md);
      color: var(--muted); cursor: pointer; padding: 6px; border-radius: 7px;
      display: flex; align-items: center; transition: all 0.2s; flex-shrink: 0;
    }
    .modal-fechar:hover { background: var(--faint); color: var(--text); }
    .modal-fechar svg { width: 14px; height: 14px; }
    .modal-pills { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .modal-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 12px; border-radius: 5px;
      font-size: 10px; font-weight: 700; border: 1px solid;
      font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.4px; text-decoration: none;
    }
    .modal-pill svg { width: 10px; height: 10px; }
    .pill-red    { background: var(--red-dim);    color: var(--red);    border-color: var(--red-bd); }
    .pill-yellow { background: var(--yellow-dim); color: var(--yellow); border-color: var(--yellow-bd); }
    .pill-green  { background: var(--green-dim);  color: var(--green);  border-color: var(--green-bd); }
    .pill-muted  { background: var(--surface);    color: var(--muted);  border-color: var(--border-md); }
    .modal-section-label {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .modal-section-label svg { width: 11px; height: 11px; }
    .updates-list { display: flex; flex-direction: column; gap: 8px; }
    .update-item {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 9px; padding: 13px 15px; border-left: 2px solid var(--yellow);
    }
    .update-item.resolved      { border-left-color: var(--green); }
    .update-item.investigating { border-left-color: var(--red); }
    .update-status { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 5px; font-family: var(--mono); }
    .update-body   { font-size: 12px; color: var(--text-2); line-height: 1.65; }
    .update-time   { font-size: 10px; color: var(--muted); margin-top: 7px; font-family: var(--mono); }
    .modal-no-updates {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 9px; padding: 16px; text-align: center; font-size: 12px; color: var(--muted);
    }

    .loading-grid { grid-column: 1 / -1; text-align: center; padding: 50px; color: var(--muted); font-size: 13px; }

    @media (max-width: 768px) {
      .topbar { padding: 0 18px; }
      .logo-tag { display: none; }
      .wrap { padding: 20px 16px 60px; }
      .cards-grid { grid-template-columns: 1fr; }
      .hero { flex-direction: column; }
      .hero-meta { flex-direction: row; justify-content: space-between; min-width: unset; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-logo">
      <div class="logo-icon"><i data-lucide="activity"></i></div>
      <span class="logo-name">Pix Health Monitor</span>
      <span class="logo-tag">MONITOR</span>
    </div>
    <div class="topbar-right">
      <div class="topbar-clock" id="relogio">--:--:--</div>
      <div class="ws-pill" id="wsPill">
        <div class="ws-dot"></div>
        <span id="wsTexto">Conectando</span>
      </div>
      <a href="/relatorios.html" class="btn-nav">
        <i data-lucide="bar-chart-2"></i> Relatórios
      </a>
    </div>
  </header>

  <div class="wrap">

    <div class="hero">
      <div class="hero-banner up" id="banner">
        <i data-lucide="check-circle"></i>
        <span>Carregando status...</span>
      </div>
      <div class="hero-meta">
        <span class="hero-meta-label">Última verificação</span>
        <span class="hero-meta-val" id="ultimaAtt">--:--:--</span>
      </div>
    </div>

    <div class="resumo-chips" id="chips"></div>

    <!-- APIs & Infra: 3 KYC agregados + Okto sem grupo (Central Bank, Withdraw, Deposit) -->
    <div class="section">
      <div class="section-header">
        <div class="section-icon"><i data-lucide="zap"></i></div>
        <span class="section-title">APIs &amp; Infraestrutura</span>
        <span class="section-count" id="count-apis"></span>
      </div>
      <div class="cards-grid" id="grid-apis">
        <div class="loading-grid">Carregando...</div>
      </div>
    </div>

    <!-- Infraestrutura: Cloudflare -->
    <div class="section">
      <div class="section-header">
        <div class="section-icon"><i data-lucide="cloud"></i></div>
        <span class="section-title">Infraestrutura</span>
        <span class="section-count" id="count-infra"></span>
      </div>
      <div class="cards-grid" id="grid-infra">
        <div class="loading-grid">Carregando...</div>
      </div>
    </div>

    <!-- Instituições: 10 bancos da Okto (têm grupo) -->
    <div class="section">
      <div class="section-header">
        <div class="section-icon"><i data-lucide="landmark"></i></div>
        <span class="section-title">Instituições Bancárias</span>
        <span class="section-count" id="count-bancos"></span>
      </div>
      <div class="cards-grid" id="grid-bancos">
        <div class="loading-grid">Carregando...</div>
      </div>
    </div>

  </div>

  <!-- MODAL incidente -->
  <div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
    <div class="modal">
      <div class="modal-top-bar" id="modalBar"></div>
      <div class="modal-inner">
        <div class="modal-header">
          <div>
            <div class="modal-titulo" id="modalTitulo">—</div>
            <div class="modal-sub"    id="modalSub">—</div>
          </div>
          <button class="modal-fechar" onclick="fecharModalBtn()"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-pills" id="modalPills"></div>
        <div class="modal-section-label"><i data-lucide="list"></i> Atualizações do Incidente</div>
        <div class="updates-list" id="modalUpdates"></div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function tick() { document.getElementById('relogio').textContent = new Date().toLocaleTimeString('pt-BR'); }
    tick(); setInterval(tick, 1000);

    let ws, tentativas = 0;
    let incidentesAtivos = [];

    function conectarWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host);
      ws.onopen = () => {
        tentativas = 0;
        document.getElementById('wsPill').className = 'ws-pill ok';
        document.getElementById('wsTexto').textContent = 'Ao vivo';
      };
      ws.onmessage = e => {
        try { const m = JSON.parse(e.data); if (m.tipo === 'atualizacao') render(m.dados); } catch {}
      };
      ws.onclose = () => {
        document.getElementById('wsPill').className = 'ws-pill';
        document.getElementById('wsTexto').textContent = 'Reconectando';
        if (tentativas < 10) { tentativas++; setTimeout(conectarWS, 4000); }
      };
    }

    function icone(s) { return s === 'UP' ? 'check-circle' : s === 'DEGRADED' ? 'alert-triangle' : 'x-circle'; }
    function fmt(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    }

    // ── Card individual Okto ──
    function criarCardOkto(c) {
      const att = fmt(c.atualizado_em);

      // Busca incidente ativo vinculado a este componente
      const inc = incidentesAtivos.find(i =>
        i.provedor === 'Okto Payments' &&
        i.status !== 'resolved' &&
        (
          (i.afetados && i.afetados.some(a => a.toLowerCase().includes(c.nome.toLowerCase()) || c.nome.toLowerCase().includes(a.toLowerCase()))) ||
          i.nome.toLowerCase().includes(c.nome.toLowerCase()) ||
          c.nome.toLowerCase().includes(i.nome.toLowerCase())
        )
      );

      // Se tem incidente ativo, card fica amarelo mesmo com status UP
      const temIncidente = !!inc || c.incidente_ativo;
      const statusFinal  = temIncidente && c.status === 'UP' ? 'warning' : c.status.toLowerCase();
      const labelFinal   = temIncidente && c.status === 'UP' ? 'INCIDENTE' : c.label;
      const icFinal      = temIncidente && c.status === 'UP' ? 'alert-triangle' : icone(c.status);

      // Botão do log — aparece quando há incidente (ativo ou recente)
      const incParaModal = inc || incidentesAtivos.find(i =>
        i.provedor === 'Okto Payments' &&
        (i.nome.toLowerCase().includes(c.nome.toLowerCase()) || c.nome.toLowerCase().includes(i.nome.toLowerCase()))
      );
      const btn = incParaModal
        ? `<button class="btn-incidente" onclick="abrirModal('${incParaModal.id}')"><i data-lucide="file-text"></i> Log do Incidente</button>`
        : '';

      // Texto do incidente ativo inline (mesmo com componente operational)
      let incidenteInline = '';
      if (inc && c.status === 'UP') {
        const lastUpdate = inc.updates && inc.updates[0];
        incidenteInline = `
          <div class="inc-aviso">
            <div class="inc-aviso-titulo"><i data-lucide="alert-triangle"></i>${inc.nome}</div>
            ${lastUpdate ? `<div class="inc-aviso-body">${lastUpdate.body}</div>` : ''}
          </div>`;
      }

      return `
        <div class="comp-card ${statusFinal}">
          <div class="card-accent"></div>
          <div class="card-body">
            <div class="card-top">
              <div class="card-left"><div class="card-dot"></div><span class="card-nome">${c.nome}</span></div>
              <div class="status-badge"><i data-lucide="${icFinal}"></i>${labelFinal}</div>
            </div>
            <div class="card-divider"></div>
            <div class="card-meta">
              <div class="card-meta-item"><i data-lucide="activity"></i>${c.status_original || c.status.toLowerCase()}</div>
              <div class="card-meta-item"><i data-lucide="clock"></i>${att}</div>
            </div>
            ${incidenteInline}
            ${btn}
          </div>
        </div>`;
    }

    // ── Card KYC agregado: SEMPRE 1 por processadora ──
    // UP           → mensagem verde simples
    // DEGRADED/DOWN → lista os serviços afetados com nome + motivo
    function criarCardKYC(c) {
      const att = fmt(c.atualizado_em);
      let extra = '';

      if (c.status === 'UP') {
        extra = `<div class="kyc-ok"><i data-lucide="check-circle"></i>${c.mensagem || 'Todos os serviços operacionais'}</div>`;
      } else if (c.detalhes && c.detalhes.length > 0) {
        const itens = c.detalhes.map(d => {
          const cls   = d.status === 'DOWN' ? 'det-down' : 'det-degraded';
          const bdCls = d.status === 'DOWN' ? 'down'     : 'degraded';
          return `
            <div class="kyc-det-item ${cls}">
              <div class="kyc-det-row">
                <span class="kyc-det-nome">${d.nome}</span>
                <span class="kyc-det-badge ${bdCls}">${d.status}</span>
              </div>
              ${d.motivo ? `<div class="kyc-det-motivo">${d.motivo}</div>` : ''}
            </div>`;
        }).join('');
        extra = `
          <div class="kyc-detalhes">
            <div class="kyc-det-label"><i data-lucide="alert-triangle"></i>Serviços afetados</div>
            ${itens}
          </div>`;
      } else {
        extra = `<div class="kyc-warn"><i data-lucide="alert-triangle"></i>${c.mensagem || 'Instabilidade detectada'}</div>`;
      }

      return `
        <div class="comp-card ${c.status.toLowerCase()}">
          <div class="card-accent"></div>
          <div class="card-body">
            <div class="card-top">
              <div class="card-left"><div class="card-dot"></div><span class="card-nome">${c.nome}</span></div>
              <div class="status-badge"><i data-lucide="${icone(c.status)}"></i>${c.label}</div>
            </div>
            <div class="card-divider"></div>
            <div class="card-meta">
              <div class="card-meta-item"><i data-lucide="shield-check"></i>Processadora KYC</div>
              <div class="card-meta-item"><i data-lucide="clock"></i>${att}</div>
            </div>
            ${extra}
          </div>
        </div>`;
    }

    function criarCard(c) {
      if (c.categoria === 'infraestrutura') return criarCardInfra(c);
      return c.agregado ? criarCardKYC(c) : criarCardOkto(c);
    }

    // ── Card de Infraestrutura (Cloudflare + AWS) ──
    // Comportamento idêntico: incidente ativo → amarelo/vermelho + aviso inline + botão de log
    function criarCardInfra(c) {
      const att = fmt(c.atualizado_em);

      // Incidente ativo vinculado a este card
      const inc = (c.incidentes_ativos && c.incidentes_ativos.length > 0)
        ? c.incidentes_ativos[0]
        : incidentesAtivos.find(i =>
            i.provedor === 'Cloudflare' && i.status !== 'resolved'
          );

      const temIncidente  = !!inc || c.incidente_ativo;
      const statusFinal   = temIncidente && c.status === 'UP' ? 'warning' : c.status.toLowerCase();
      const labelFinal    = temIncidente && c.status === 'UP' ? 'INCIDENTE' : c.label;
      const icFinal       = temIncidente && c.status === 'UP' ? 'alert-triangle' : icone(c.status);

      // Botão de log do incidente
      const incParaModal = inc || incidentesAtivos.find(i => i.provedor === 'Cloudflare');
      const btn = incParaModal
        ? `<button class="btn-incidente" onclick="abrirModal('${incParaModal.id}')"><i data-lucide="file-text"></i> Log do Incidente</button>`
        : '';

      // Aviso inline quando há incidente mas componente está UP
      let incidenteInline = '';
      if (inc && c.status === 'UP') {
        const lastUpdate = inc.updates && inc.updates[0];
        incidenteInline = `
          <div class="inc-aviso">
            <div class="inc-aviso-titulo"><i data-lucide="alert-triangle"></i>${inc.nome}</div>
            ${lastUpdate ? `<div class="inc-aviso-body">${lastUpdate.body}</div>` : ''}
          </div>`;
      }

      // Detalhes de serviços afetados quando status != UP
      let detalhesHtml = '';
      if (c.status !== 'UP' && c.detalhes && c.detalhes.length > 0) {
        const itens = c.detalhes.map(d => {
          const cls   = d.status === 'DOWN' ? 'det-down' : 'det-degraded';
          const bdCls = d.status === 'DOWN' ? 'down'     : 'degraded';
          return `
            <div class="kyc-det-item ${cls}">
              <div class="kyc-det-row">
                <span class="kyc-det-nome">${d.nome}</span>
                <span class="kyc-det-badge ${bdCls}">${d.status}</span>
              </div>
              ${d.motivo ? `<div class="kyc-det-motivo">${d.motivo}</div>` : ''}
            </div>`;
        }).join('');
        detalhesHtml = `
          <div class="kyc-detalhes">
            <div class="kyc-det-label"><i data-lucide="alert-triangle"></i>Serviços afetados</div>
            ${itens}
          </div>`;
      } else if (c.status === 'UP' && !temIncidente) {
        detalhesHtml = `<div class="kyc-ok"><i data-lucide="check-circle"></i>Todos os serviços operacionais</div>`;
      }

      return `
        <div class="comp-card ${statusFinal}">
          <div class="card-accent"></div>
          <div class="card-body">
            <div class="card-top">
              <div class="card-left"><div class="card-dot"></div><span class="card-nome">${c.nome}</span></div>
              <div class="status-badge"><i data-lucide="${icFinal}"></i>${labelFinal}</div>
            </div>
            <div class="card-divider"></div>
            <div class="card-meta">
              <div class="card-meta-item"><i data-lucide="cloud"></i>${c.provedor}</div>
              <div class="card-meta-item"><i data-lucide="clock"></i>${att}</div>
            </div>
            ${detalhesHtml}
            ${incidenteInline}
            ${btn}
          </div>
        </div>`;
    }

    function render(dados) {
      document.getElementById('ultimaAtt').textContent = new Date(dados.timestamp).toLocaleTimeString('pt-BR');
      const { resumo, geral, incidentes = [], incidentes_ativos = [] } = dados;
      incidentesAtivos = incidentes;

      // ── FONTE DE VERDADE: componentes_dashboard ──
      const dashboard = dados.componentes_dashboard || dados.componentes || [];

      // Banner
      const banner = document.getElementById('banner');
      const ind    = geral?.indicator || 'none';
      let cls = 'up', ic = 'check-circle', msg = 'Todos os sistemas operacionais';
      if (resumo.down > 0 || ind === 'critical' || ind === 'major') {
        cls = 'down'; ic = 'x-circle';
        msg = resumo.down > 0 ? `${resumo.down} sistema${resumo.down>1?'s':''} fora do ar` : 'Interrupção confirmada pela StatusPage';
      } else if (resumo.degraded > 0 || ind === 'minor' || ind === 'maintenance') {
        cls = 'degraded'; ic = 'alert-triangle';
        // Se há incidente ativo mas componente ainda operational
        if (resumo.degraded === 0 && resumo.down === 0 && incidentes_ativos.length > 0) {
          msg = `${incidentes_ativos.length} incidente${incidentes_ativos.length>1?'s':''} ativo${incidentes_ativos.length>1?'s':''} reportado${incidentes_ativos.length>1?'s':''} pela Okto`;
        } else {
          msg = resumo.degraded > 0 ? `${resumo.degraded} sistema${resumo.degraded>1?'s':''} com degradação detectada` : 'Degradação ou manutenção em andamento';
        }
      }
      banner.className = 'hero-banner ' + cls;
      banner.innerHTML = `<i data-lucide="${ic}"></i><span>${msg}</span>`;

      // Chips
      const dUp  = dashboard.filter(c => c.status === 'UP' && !c.incidente_ativo).length;
      const dDeg = dashboard.filter(c => c.status === 'DEGRADED').length;
      const dDwn = dashboard.filter(c => c.status === 'DOWN').length;
      const dInc = dashboard.filter(c => c.incidente_ativo).length;
      document.getElementById('chips').innerHTML = `
        <div class="chip chip-up"><i data-lucide="check-circle"></i>OPERACIONAL: ${dUp}</div>
        ${dDeg > 0 ? `<div class="chip chip-degraded"><i data-lucide="alert-triangle"></i>DEGRADAÇÃO: ${dDeg}</div>` : ''}
        ${dDwn > 0 ? `<div class="chip chip-down"><i data-lucide="x-circle"></i>DOWN: ${dDwn}</div>` : ''}
        ${dInc > 0 ? `<div class="chip chip-incident"><i data-lucide="file-warning"></i>INCIDENTE: ${dInc}</div>` : ''}
        <div class="chip chip-total"><i data-lucide="layers"></i>TOTAL: ${dashboard.length}</div>
      `;

      // Separação das seções
      // APIs & Infra → KYC agregados + Okto sem grupo (Central Bank, Withdraw, Deposit)
      // Infraestrutura → Cloudflare
      // Instituições → bancos Okto com grupo
      const apis   = dashboard.filter(c => (c.agregado && c.categoria === 'kyc')
                                        || (c.categoria === 'pagamentos' && !c.grupo));
      const infra  = dashboard.filter(c => c.categoria === 'infraestrutura');
      const bancos = dashboard.filter(c => c.categoria === 'pagamentos' && c.grupo);

      document.getElementById('count-apis').textContent   = `${apis.length} componente${apis.length!==1?'s':''}`;
      document.getElementById('count-infra').textContent  = `${infra.length} provedor${infra.length!==1?'es':''}`;
      document.getElementById('count-bancos').textContent = `${bancos.length} instituiç${bancos.length!==1?'ões':'ão'}`;

      document.getElementById('grid-apis').innerHTML   = apis.length   ? apis.map(criarCard).join('')   : '<div class="loading-grid">Nenhum dado</div>';
      document.getElementById('grid-infra').innerHTML  = infra.length  ? infra.map(criarCard).join('')  : '<div class="loading-grid">Nenhum dado</div>';
      document.getElementById('grid-bancos').innerHTML = bancos.length ? bancos.map(criarCard).join('') : '<div class="loading-grid">Nenhum dado</div>';

      lucide.createIcons();
    }

    // Modal de incidente
    function abrirModal(id) {
      const inc = incidentesAtivos.find(i => i.id === id);
      if (!inc) return;
      const deg = inc.impacto === 'minor' || inc.impacto === 'maintenance';
      document.getElementById('modalBar').className    = 'modal-top-bar' + (deg ? ' degraded' : '');
      document.getElementById('modalTitulo').textContent = inc.nome;
      document.getElementById('modalSub').textContent    = `Atualizado em ${fmt(inc.atualizado)}`;
      const impMap = { none:'pill-muted|Nenhum', minor:'pill-yellow|Menor', major:'pill-red|Grave', critical:'pill-red|Crítico', maintenance:'pill-yellow|Manutenção' };
      const [impCls, impLbl] = (impMap[inc.impacto] || 'pill-muted|' + inc.impacto).split('|');
      const stMap = { investigating:'pill-red', identified:'pill-yellow', monitoring:'pill-yellow', resolved:'pill-green' };
      document.getElementById('modalPills').innerHTML = `
        <span class="modal-pill ${impCls}"><i data-lucide="alert-triangle"></i>${impLbl}</span>
        <span class="modal-pill ${stMap[inc.status]||'pill-muted'}"><i data-lucide="circle"></i>${inc.status}</span>
        ${inc.url ? `<a href="${inc.url}" target="_blank" class="modal-pill pill-muted"><i data-lucide="external-link"></i>StatusPage</a>` : ''}
      `;
      const ups = inc.updates || [];
      document.getElementById('modalUpdates').innerHTML = ups.length
        ? ups.map(u => `
            <div class="update-item ${u.status==='resolved'?'resolved':u.status==='investigating'?'investigating':''}">
              <div class="update-status">${u.status}</div>
              <div class="update-body">${u.body||'—'}</div>
              <div class="update-time">${fmt(u.updated_at)}</div>
            </div>`).join('')
        : `<div class="modal-no-updates">Nenhuma atualização registrada para este incidente.</div>`;
      document.getElementById('modalOverlay').classList.add('open');
      lucide.createIcons();
    }

    function fecharModalBtn() { document.getElementById('modalOverlay').classList.remove('open'); }
    function fecharModal(e)   { if (e.target === document.getElementById('modalOverlay')) fecharModalBtn(); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModalBtn(); });

    setTimeout(() => {
      conectarWS();
      fetch('/api/status').then(r => r.json()).then(d => {
        if (d?.componentes_dashboard || d?.componentes) render(d);
      }).catch(() => {});
    }, 300);
  </script>
</body>
</html>
